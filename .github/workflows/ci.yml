name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.0"
      - name: Install dependencies (from the lockfile)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: License check (AGPL-compatible allowlist, ADR-0009)
        run: >-
          uv run pip-licenses --from=mixed --ignore-packages portfolio-tracker --partial-match
          --allow-only="MIT;BSD;Apache-2.0;Apache Software License;ISC;PSF-2.0;Python-2.0;MPL-2.0;LGPL;0BSD;CC0;Unlicense;BlueOak"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (from the lockfile)
        run: npm ci --no-audit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: License check (AGPL-compatible allowlist, ADR-0009)
        run: npm run licenses

  image:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image (linux/amd64, not pushed)
        run: docker buildx build --platform linux/amd64 --load -t portfolio-tracker:ci .
      - name: Start container and wait for the health endpoint
        run: |
          docker run -d --name pt -p 8000:8000 portfolio-tracker:ci
          for i in $(seq 1 50); do
            if curl -sf http://localhost:8000/api/health; then echo; exit 0; fi
            sleep 0.2
          done
          docker logs pt
          exit 1
      - name: Report image size and memory (targets < 200 MB, < 256 MB idle)
        run: |
          docker image inspect portfolio-tracker:ci --format 'image size: {{.Size}} bytes'
          docker stats --no-stream --format 'memory: {{.MemUsage}}' pt
