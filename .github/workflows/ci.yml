name: CI

on:
  # Once per change: pull requests run CI on their branch; main runs it again after a merge.
  # (A plain `push:` also fired on every PR branch, so each push ran the workflow twice.)
  # Keep `push` on main only: release.yml calls this workflow on a tag, and a `tags:` trigger
  # here would share its concurrency group (ci-<ref>) and cancel the release's own CI run.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI on the tagged commit before it publishes (D-167).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Install dependencies (from the lockfile)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: License check (AGPL-compatible allowlist, ADR-0009)
        # sortedcontainers (dependency of hypothesis, dev only) declares only the generic
        # classifier "Apache Software License"; its LICENSE file is Apache-2.0.
        # Verified by hand for sortedcontainers 2.4.0 on 2026-10-13: re-check when it changes.
        # defusedxml declares only the classifier "Python Software Foundation License" (PSF,
        # permissive, AGPL-compatible); listed by name because it does not match PSF-2.0.
        run: >-
          uv run pip-licenses --from=mixed --ignore-packages portfolio-tracker sortedcontainers
          --partial-match
          --allow-only="MIT;BSD;Apache-2.0;ISC;PSF-2.0;Python-2.0;Python Software Foundation License;MPL-2.0;LGPL;0BSD;CC0;Unlicense;BlueOak"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (from the lockfile)
        run: npm ci --no-audit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle size budget (D-138)
        run: npm run budget
      - name: License check (AGPL-compatible allowlist, ADR-0009)
        run: npm run licenses

  e2e:
    # The built frontend served by FastAPI, in Chromium, on throwaway development data
    # directories (invented data only; market data off, or on invented fakes): see
    # frontend/playwright.config.ts.
    runs-on: ubuntu-24.04
    # The Chromium install alone took 10 minutes on a slow runner (October 2026); the tests
    # take about 2.5.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (from the lockfiles)
        run: |
          npm ci --no-audit
          uv sync --locked --directory ../backend
      - name: Install Chromium for Playwright, with its system libraries
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds the frontend first)
        run: npm run e2e
      - name: Keep the Playwright traces of a failed run (7 days; invented data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  walkthrough:
    # The M5 acceptance path as one scenario (D-159), on a server the spec starts, stops and
    # restarts itself (fresh data folder, market data off, invented fixtures only). Its own job,
    # in parallel to the others, so the total time does not grow.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (from the lockfiles)
        run: |
          npm ci --no-audit
          uv sync --locked --directory ../backend
      - name: Install Chromium for Playwright, with its system libraries
        run: npx playwright install --with-deps chromium
      - name: The walkthrough (builds the frontend first)
        run: npm run e2e:walkthrough
      - name: Keep the Playwright trace of a failed run (7 days; invented data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough-trace
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (linux/amd64, not pushed), with the build information (D-167)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)
          build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          build_commit=$(git rev-parse HEAD)
          test -n "$version" && test -n "$build_date"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Python writes a suffixed version its own way (PEP 440): 1.0.0-rc.1 is 1.0.0rc1.
          py_version=$(printf '%s' "$version" | sed -E 's/-(a)lpha\.|-(b)eta\.|-(rc)\./\1\2\3/')
          echo "PY_VERSION=$py_version" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$build_commit" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load \
            --build-arg VERSION="$version" \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg BUILD_COMMIT="$build_commit" \
            -t portfolio-tracker:ci .
      - name: Start container and wait for the health endpoint
        run: |
          docker run -d --name pt -p 8000:8000 portfolio-tracker:ci
          for i in $(seq 1 50); do
            if curl -sf http://localhost:8000/api/health; then echo; exit 0; fi
            sleep 0.2
          done
          docker logs pt
          exit 1
      - name: Health shows the version, the build date and the preview flag (D-167)
        run: |
          curl -sf http://localhost:8000/api/health -o health.json
          python3 -c '
          import json, os, re
          body, v = json.load(open("health.json")), os.environ["VERSION"]
          preview = not re.fullmatch(r"\d+\.\d+\.\d+", v) or v.split(".")[0] == "0"
          print(body)
          assert body["version"] == os.environ["PY_VERSION"]
          assert body["build_date"] == os.environ["BUILD_DATE"]
          assert body["preview"] is preview'
      - name: The OCI labels name the version, the build and the source (D-167)
        run: |
          docker image inspect portfolio-tracker:ci --format '{{json .Config.Labels}}' > labels.json
          python3 -c '
          import json, os
          labels = {k.removeprefix("org.opencontainers.image."): v
                    for k, v in json.load(open("labels.json")).items()}
          print(labels)
          assert labels["version"] == os.environ["VERSION"]
          assert labels["created"] == os.environ["BUILD_DATE"]
          assert labels["revision"] == os.environ["BUILD_COMMIT"]
          assert labels["source"] == "https://github.com/Horo86/portfolio-tracker"
          assert labels["licenses"] == "AGPL-3.0-only"
          assert labels["title"] == "Portfolio Tracker"'
      - name: The licence and the third-party notices are in the image and served (D-167)
        run: |
          docker run --rm --entrypoint sh portfolio-tracker:ci -c '
            grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" /app/LICENSE &&
            grep -q "^echarts@" /app/static/licenses/THIRD-PARTY.txt &&
            grep -q "Licensed under the Apache License" /app/static/licenses/THIRD-PARTY.txt &&
            grep -q "^fastapi==" /app/static/licenses/BACKEND-THIRD-PARTY.txt &&
            find /app/.venv -path "*fastapi-*.dist-info/*" -iname "LICENSE*" | grep -q .'
          curl -sf http://localhost:8000/licenses/THIRD-PARTY.txt -o third-party.txt
          grep -q '^react@' third-party.txt
          curl -sf http://localhost:8000/licenses/Manrope-OFL.txt -o manrope.txt
          grep -q 'SIL OPEN FONT LICENSE' manrope.txt
      - name: The server's notices and both lists for About are in the image and served (D-167)
        # backend.json lists the installed packages only: no development package, not the app.
        run: |
          for file in BACKEND-THIRD-PARTY.txt backend.json frontend.json; do
            curl -sf "http://localhost:8000/licenses/$file" -o "$file"
          done
          python3 -c '
          import json
          text = open("BACKEND-THIRD-PARTY.txt", encoding="utf-8").read()
          start = text.index("\nfastapi==")
          fastapi = text[start : text.index("-" * 78, start)]
          assert "Licence: MIT" in fastapi and "Permission is hereby granted" in fastapi, fastapi
          server = {row["name"].lower(): row for row in json.load(open("backend.json"))}
          web = {row["name"]: row for row in json.load(open("frontend.json"))}
          print(len(server), "server packages,", len(web), "web app packages")
          assert server["fastapi"]["license"] == "MIT"
          assert server["sqlalchemy"]["license"] == "MIT"
          assert not {"pytest", "ruff", "pip-licenses", "hypothesis", "portfolio-tracker"} & set(server)
          assert web["react"]["license"] == "MIT" and web["react"]["version"]
          assert web["echarts"]["license"] == "Apache-2.0"'
      - name: The built app is served at /, with its cache headers
        run: |
          curl -sf http://localhost:8000/ | grep -q '<div id="root"></div>'
          curl -sfI http://localhost:8000/ | grep -qi '^cache-control: no-cache'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/assets/missing.js)" = 404
      - name: The test-only launcher with fake market data is not in the image
        # As root, so no folder is unreadable; a failing find fails the step.
        run: |
          found=$(docker run --rm --user 0 --entrypoint find portfolio-tracker:ci / \
            \( -path /proc -o -path /sys \) -prune -o -name 'e2e_market_server*' -print)
          if [ -n "$found" ]; then echo "in the image: $found"; exit 1; fi
      - name: Report image size and memory (targets < 200 MB, < 256 MB idle)
        run: |
          docker image inspect portfolio-tracker:ci --format 'image size: {{.Size}} bytes'
          docker stats --no-stream --format 'memory: {{.MemUsage}}' pt
      - name: Upgrade a data folder of the previous release's image with this image (D-168)
        # The previous image is public and pinned by digest in .github/upgrade-from.txt; no token.
        run: |
          python3 .github/scripts/upgrade-image-check.py --old-from .github/upgrade-from.txt \
            --new portfolio-tracker:ci --port 8001 --folder "$RUNNER_TEMP/pt-upgrade-check"
      - name: The backup command writes a checked archive inside the container (D-169)
        run: |
          docker exec pt python -m portfolio_tracker backup
          docker exec pt python -c '
          import json, zipfile
          from pathlib import Path
          [archive] = Path("/data/backups/manual").glob("portfolio-*.zip")
          zf = zipfile.ZipFile(archive)
          names = sorted(zf.namelist())
          manifest = json.loads(zf.read("manifest.json"))
          print(archive.name, names, manifest["schema_revision"])
          assert names == ["attachments/", "db/app.sqlite", "manifest.json"], names
          assert manifest["format"] == 1 and manifest["encrypted"] is False
          assert manifest["excluded"]["tables"] == ["provider_credentials", "sessions"]
          assert oct(archive.stat().st_mode & 0o777) == "0o600"'
      - name: The restore command restores that archive into a new folder, which then starts (D-169)
        run: |
          set -euo pipefail
          archive=$(docker exec pt sh -c 'ls /data/backups/manual/portfolio-*.zip' | head -n 1)
          folder="$RUNNER_TEMP/pt-restore-check"
          mkdir -p "$folder/restore"
          docker cp "pt:$archive" "$folder/restore/backup.zip"
          as_me="$(id -u):$(id -g)"
          docker run --rm --user "$as_me" -v "$folder:/data" portfolio-tracker:ci \
            python -m portfolio_tracker restore /data/restore/backup.zip
          stat -c 'restored database: mode %a, owner %u' "$folder/db/app.sqlite"
          test "$(stat -c %u "$folder/db/app.sqlite")" = "$(id -u)"
          docker run -d --name pt-restored --user "$as_me" -p 127.0.0.1:8002:8000 \
            -v "$folder:/data" portfolio-tracker:ci
          up=no
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8002/api/health; then up=yes; echo; break; fi
            sleep 0.5
          done
          if [ "$up" != yes ]; then docker logs pt-restored; exit 1; fi
          # While it runs, a restore into its folder is refused (the data folder's lock).
          if docker exec pt-restored python -m portfolio_tracker restore /data/restore/backup.zip; then
            echo "a restore was not refused while the app runs"; exit 1
          fi
          docker rm -f pt-restored
