name: Release

# Publishes the image of a release (D-167). Only a pushed tag vX.Y.Z (or vX.Y.Z-rc.N, -beta.N,
# -alpha.N) on the main repository runs it: never a pull request, a branch or a fork. Nothing
# is pushed unless the tag matches both version files, the commit is on main or on the tag's own
# release/X.Y branch (D-170), and all of CI (end-to-end tests and the walkthrough included) is
# green on the tagged commit.
#
# Untrusted text (the tag name, the actor) reaches the shell only through environment
# variables, never through ${{ }} inside a script, and the tag is checked against a strict
# pattern before anything uses it. A version already in the registry is never pushed again.
# The aliases X.Y, X and latest move only to the highest plain version in their scope (X and
# latest from 1.0.0), are decided before any push, and go up in the same push as X.Y.Z.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

# One release at a time, whatever the tag: a run starts only after the previous one ended, so
# its view of the tags and of the registry is current. Never cancelled midway.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -e and -o pipefail

env:
  IMAGE: ghcr.io/horo86/portfolio-tracker

jobs:
  verify:
    if: github.repository == 'Horo86/portfolio-tracker' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      py_version: ${{ steps.check.outputs.py_version }}
      build_date: ${{ steps.check.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, to check that the tagged commit is on it
          persist-credentials: false
      - name: The tag, pyproject.toml and package.json carry one version; the commit is on main or release/X.Y
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::tag is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          version="${TAG#v}"
          python3 - "$version" <<'EOF'
          import json, sys, tomllib
          version = sys.argv[1]
          found = {
              "backend/pyproject.toml": tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"],
              "frontend/package.json": json.load(open("frontend/package.json"))["version"],
          }
          lock = json.load(open("frontend/package-lock.json"))
          found["frontend/package-lock.json"] = lock["version"]
          found['frontend/package-lock.json packages[""]'] = lock["packages"][""]["version"]
          wrong = {name: value for name, value in found.items() if value != version}
          if wrong:
              print(f"::error::the tag says {version}, but {wrong}")
              sys.exit(1)
          EOF
          test "$(git rev-parse --verify "$GITHUB_SHA^{commit}")" = "$GITHUB_SHA" || {
            echo "::error::GITHUB_SHA is not a commit"
            exit 1
          }
          python3 .github/scripts/release-line.py "$version" "$GITHUB_SHA"
          py_version=$(printf '%s' "$version" | sed -E 's/-(a)lpha\.|-(b)eta\.|-(rc)\./\1\2\3/')
          build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$GITHUB_SHA")
          {
            echo "version=$version"
            echo "py_version=$py_version"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
          echo "release $version, built $build_date (which aliases move is decided in publish, before the push)"
      - name: Every earlier stable release has an upgrade fixture (D-168)
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: python3 .github/scripts/upgrade-fixture-gate.py "$VERSION"
      - name: The release notes of this version, from CHANGELOG.md (D-173)
        # Refused when the version has no notes; written to the run's summary and kept as a file
        # for the GitHub release, which the maintainer creates by hand (D-167).
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          python3 .github/scripts/release-notes.py "$VERSION" --output release-notes.md
          { echo "## Release notes of $VERSION"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the release notes for the GitHub release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PY_VERSION: ${{ needs.verify.outputs.py_version }}
      BUILD_DATE: ${{ needs.verify.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags, for the highest-patch check just before the push
          persist-credentials: false
      - name: Build the image (linux/amd64, one image, no attestations)
        run: |
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load \
            --build-arg VERSION="$VERSION" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg BUILD_COMMIT="$GITHUB_SHA" \
            -t portfolio-tracker:release .
      - name: Smoke test the image before pushing it, and check its labels
        run: |
          docker run -d --name smoke -p 8000:8000 portfolio-tracker:release
          ./.github/scripts/check-health.sh
          curl -sf http://localhost:8000/ -o index.html
          grep -q '<div id="root"></div>' index.html
          docker rm -f smoke
          docker image inspect portfolio-tracker:release --format '{{json .Config.Labels}}' > labels.json
          python3 - <<'EOF'
          import json, os
          labels = {k.removeprefix("org.opencontainers.image."): v
                    for k, v in json.load(open("labels.json")).items()}
          print(labels)
          assert labels["version"] == os.environ["VERSION"]
          assert labels["created"] == os.environ["BUILD_DATE"]
          assert labels["revision"] == os.environ["GITHUB_SHA"]
          assert labels["source"] == "https://github.com/Horo86/portfolio-tracker"
          assert labels["licenses"] == "AGPL-3.0-only"
          EOF
      - name: Decide the aliases before any push (X.Y, X, latest; D-170 (4))
        run: |
          # On this job's own fetch of the tags: a re-run of an older release ("Re-run failed
          # jobs" included) sees the newer tags and moves nothing back. A failure here (the
          # tag being released not among the tags read, say) stops the job: nothing is pushed.
          aliases=$(python3 .github/scripts/image-aliases.py "$VERSION")
          echo "ALIASES=$aliases" >> "$GITHUB_ENV"
          echo "this release pushes $VERSION and the aliases: ${aliases:-none}"
      - name: Log in to the GitHub Container Registry (the workflow's own token)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Refuse a version that is already in the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: python3 .github/scripts/refuse-existing-tag.py
      - name: Push X.Y.Z and its aliases in one push command
        run: |
          # The smoke-tested image gets X.Y.Z and every alias decided above as local names,
          # then one `docker push --all-tags` sends exactly those names (checked first).
          read -r -a aliases <<< "$ALIASES"
          docker tag portfolio-tracker:release "$IMAGE:$VERSION"
          for alias in "${aliases[@]}"; do
            docker tag portfolio-tracker:release "$IMAGE:$alias"
          done
          expected=$(printf '%s\n' "$VERSION" "${aliases[@]}" | sort)
          local_tags=$(docker image ls "$IMAGE" --format '{{.Tag}}' | sort)
          if [ "$local_tags" != "$expected" ]; then
            echo "::error::local names of $IMAGE are [$local_tags], expected [$expected]: nothing pushed"
            exit 1
          fi
          docker push --all-tags "$IMAGE"
          docker image inspect "$IMAGE:$VERSION" --format '{{range .RepoDigests}}{{println .}}{{end}}' > digests.txt
          digest=$(grep -m 1 "^$IMAGE@sha256:" digests.txt)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "pushed $digest as $VERSION ${ALIASES}"
      - name: Pull the pushed image by digest and check it again
        run: |
          read -r -a aliases <<< "$ALIASES"
          docker image rm portfolio-tracker:release "$IMAGE:$VERSION" "${aliases[@]/#/$IMAGE:}"
          docker pull "$DIGEST"
          docker run -d --name pulled -p 8000:8000 "$DIGEST"
          ./.github/scripts/check-health.sh
          docker rm -f pulled
      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io
